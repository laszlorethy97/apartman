<div class="background">
    <div class="header">
        <div class="logo"></div>
        <div class="title-container">
            <button class="label">Our Story</button>
            <button class="label">Booking</button>
            <button class="label">AI Chat</button>
            <button class="label">Edit Data</button>
        </div>
    </div>
    <div class="body">
        <div class="chat-window">
            <div [ngClass]="{'robot-message': message.isRobot, 'human-message': !message.isRobot}" *ngFor="let message of messages">{{message.text}}</div>
        </div>
        <div class="input-container">
            <input (keyup.enter)="sendMessage()" class="input-box" type="text" [(ngModel)]="inputText">
            <button (click)="sendMessage()" class="send-button">send</button>
        </div>

    </div>
</div>
