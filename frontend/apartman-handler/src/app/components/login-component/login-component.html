<div class="background">
    <div class="left-side">
        <div class="logo"></div>
        <div class="login">Login</div>
    </div>
    <div class="right-side">
        <div class="content-container">
            <div class="username">
                <div class="username-logo"></div>
                <input class="username-input" placeholder="User Name" type="text">
            </div>
            <div class="password">
                <div class="password-logo"></div>
                <input class="password-input" placeholder="Password" type="text">
            </div>
            <div class="button-container">
                <button (click)="login()" class="sing-in">Sing In</button>
                <button (click)="createAccount()" class="create-account">Create Account</button>
            </div>
        </div>
    </div>
</div>
