<div class="background">
    <div class="left-side">
        <div class="logo"></div>
        <div class="login">Login</div>
    </div>
    <div class="right-side">
        <div class="content-container">
            <form [formGroup]="loginForm" (ngSubmit)="login()">
                <div class="username">
                    <div class="username-logo"></div>
                    <input formControlName="userName" class="username-input" placeholder="User Name" type="text">
                </div>
                <div class="password">
                    <div class="password-logo"></div>
                    <input formControlName="password" class="password-input" placeholder="Password" type="text">
                </div>
                <div class="button-container">
                    <button type="submit" class="sing-in">Sing In</button>
                    <button type="button" (click)="createAccount()" class="create-account">Create Account</button>
                </div>
                <div class="fail-message" *ngIf="loginfaild()">Invalid username or password.</div>
            </form>
        </div>
    </div>
</div>
